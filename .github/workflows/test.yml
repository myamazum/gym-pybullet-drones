name: Test Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install test and build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build 'pytest>=9,<10'
    - name: Build and install wheel
      run: |
        python -m build
        python -m pip install dist/*.whl
    - name: Smoke-test the installed wheel outside the checkout
      working-directory: /tmp
      run: |
        python -c "from gym_pybullet_drones.control.DSLPIDControl import DSLPIDControl; from gym_pybullet_drones.utils.enums import DroneModel; assert DSLPIDControl(DroneModel.CF2X).KF > 0"
        python -c "from gym_pybullet_drones.utils.resources import asset_path; from pathlib import Path; assert Path(asset_path('cf2x.urdf')).is_file()"
    - name: Unit tests
      run: |
        python -m pytest
